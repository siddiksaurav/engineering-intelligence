spring:
  application:
    name: ei
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ei}
    username: ${POSTGRES_USER:ei}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      ddl-auto: validate

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# Operating settings, not rules of the evaluation (decision 45).
ei:
  jobs:
    count-flush-interval: 30s
  github:
    api-url: https://api.github.com
    # Read-only. From .env; never committed, never printed.
    token: ${GITHUB_TOKEN:}
    rate-limit-reserve: 50
    retries: 3
    retry-wait: 2s
    timeout: 60s
  openproject:
    api-url: https://community.openproject.org/api/v3
    page-size: 100
    # Calls are made one at a time with this wait between them, to be polite to a public server.
    pause: 200ms
    retries: 3
    retry-wait: 2s
    timeout: 60s

---
# The one .env at the repository root. Found when started from the root or from backend/.
# A value set in the real environment wins over the file. Tests run with the profile "test" and
# never read it: it holds real tokens, and a test must never reach a real, paid service.
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
