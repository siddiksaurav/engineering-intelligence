spring:
  application:
    name: ei
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:ei}
    username: ${POSTGRES_USER:ei}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that the entities match it.
      ddl-auto: validate

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

# Operating settings, not rules of the evaluation (decision 45).
ei:
  jobs:
    count-flush-interval: 30s
  github:
    api-url: https://api.github.com
    # Read-only. From .env; never committed, never printed.
    token: ${GITHUB_TOKEN:}
    rate-limit-reserve: 50
    retries: 3
    retry-wait: 2s
    timeout: 60s
  openproject:
    api-url: https://community.openproject.org/api/v3
    page-size: 100
    # Calls are made one at a time with this wait between them, to be polite to a public server.
    pause: 200ms
    retries: 3
    retry-wait: 2s
    timeout: 60s
  judgment:
    # Free hosted models, tried in this order (decisions 144, 146, 158). A provider with no key is
    # left out. The keys come from .env; never committed, never printed.
    providers:
      - name: ${LLM_PROVIDER_1_NAME:groq}
        base-url: ${LLM_PROVIDER_1_BASE_URL:https://api.groq.com/openai/v1}
        api-key: ${LLM_PROVIDER_1_API_KEY:}
        model: ${LLM_PROVIDER_1_MODEL:openai/gpt-oss-120b}
        reasoning-effort: ${LLM_PROVIDER_1_REASONING_EFFORT:low}
      - name: ${LLM_PROVIDER_2_NAME:gemini}
        base-url: ${LLM_PROVIDER_2_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
        api-key: ${LLM_PROVIDER_2_API_KEY:}
        model: ${LLM_PROVIDER_2_MODEL:gemini-2.5-flash}
        reasoning-effort: ${LLM_PROVIDER_2_REASONING_EFFORT:}
    timeout: 120s
    retries: 3
    retry-wait: 2s
    # A rate limit that asks for a longer wait puts the provider at its limit for the run.
    max-rate-limit-wait: 60s
    # One request needs about this many tokens; with fewer left in the window the next call waits for
    # the reset (Groq free: 8,000 tokens per minute).
    min-remaining-tokens: 6000
    max-diff-characters: 12000
    max-body-characters: 4000
    max-error-characters: 300
    # Stage 2 inputs (F07). Free tier: a call stays under about 8,000 tokens, so about 14,000 characters.
    max-description-characters: 1500
    max-feature-work-characters: 14000
    max-hunk-characters: 2000
    max-comment-characters: 2000
    max-replied-comment-characters: 500
    max-review-characters: 12000
    # A comment quoted in a judgment fact; the whole comment is one click away at its link.
    max-quote-characters: 200

---
# The one .env at the repository root. Found when started from the root or from backend/.
# A value set in the real environment wins over the file. Tests run with the profile "test" and
# never read it: it holds real tokens, and a test must never reach a real, paid service.
spring:
  config:
    activate:
      on-profile: "!test"
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
